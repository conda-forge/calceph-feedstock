{% set version = "5.0.0" %}

package:
  name: calceph
  version: {{ version }}

source:
  url: https://www.imcce.fr/content/medias/recherche/equipes/asd/calceph/calceph-{{ version }}.tar.gz
  sha256: aea5120af73f0a492cea2fdc9c63078ee5b625a181cc4f0622ffa68160a2d20b


build:
  number: 0
  run_exports:
    # SO name changes at minor rev bumps.
    - {{ pin_subpackage('calceph', max_pin='x.x') }}

requirements:
  build:
    - cmake
    - {{ compiler("c") }}
    - {{ stdlib("c") }}
    - make                # [unix]

test:
  commands:
    - test -f $PREFIX/include/calceph.h                           # [unix]
    - test -f $PREFIX/lib/libcalceph${SHLIB_EXT}                  # [unix]
    - if not exist %PREFIX%\\Library\\include\\calceph.h exit 1   # [win]
    - if not exist %PREFIX%\\Library\\lib\\calceph.lib exit 1     # [win]

about:
  home: https://calceph.imcce.fr/
  license: CECILL-C OR CECILL-B OR CECILL-2.1
  license_file: COPYING_CECILL_C.LIB
  summary: A library to access the binary ephemeris files of solar system bodies
  dev_url: https://gitlab.obspm.fr/imcce_calceph/calceph

extra:
  recipe-maintainers:
    - bluescarni
